<!DOCTYPE html>
<html lang="en">
<head>
<title>HTML Layout - Grid</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
* {box-sizing: border-box;}
body {font-family: Arial, Helvetica, sans-serif; margin: 0;}

.container {
  display: grid;
  grid-template-areas:
    "header header header"
    "menu   content ads"
    "footer footer footer";
  grid-template-columns: 1fr 2fr 1fr;
  min-height: 100vh;
  grid-template-rows: auto 1fr auto;
}

header {
  grid-area: header;
  background-color: #666;
  padding: 20px;
  text-align: center;
  color: white;
}

header h1 {
  font-size: 2.5rem;
  margin: 0;
}

nav {
  grid-area: menu;
  background-color: #ccc;
  padding: 15px;
}

nav ul {
  list-style-type: none;
  padding: 0;
}

main {
  grid-area: content;
  background-color: #f1f1f1;
  padding: 15px;
}

main h1 {
  font-size: 2rem;
}

form {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 10px 15px;
  align-items: center;
  max-width: 400px;
}

form button {
  grid-column: 2;
  justify-self: start;
}

aside {
  grid-area: ads;
  background-color: #ddd;
  padding: 15px;
  text-align: left;
}

aside a {
  display: block;
  margin-bottom: 10px;
}

aside img {
  display: block;
}

footer {
  grid-area: footer;
  background-color: #888;
  padding: 10px;
  text-align: center;
  color: white;
}

@media (max-width: 600px) {
  .container {
    grid-template-areas:
      "header"
      "menu"
      "content"
      "ads"
      "footer";
    grid-template-columns: 1fr;
    grid-template-rows: auto;
  }
}
</style>
</head>
<body>

<div class="container">

  <header><h1>Schedule</h1></header>

  <nav>
    <ul>
      <li><a href="#">Home</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
  </nav>

  <main>
    <h1>Login</h1>
    <form action="/register" method="post">
      <label for="email">Email: </label>
      <input type="email" id="email" name="email" required>

      <label for="password">Password:</label>
      <input type="password" id="password" name="password" minlength="8" required>

      <button type="submit">Login</button>
    </form>
  </main>

  <aside>
    <h2>Ads</h2>
    <a href="https://web.facebook.com/home.php">
      <img src="Facebook.png" alt="Facebook" style="width:50px; height:50px">
    </a>
    <a href="https://www.youtube.com/">
      <img src="Youtube.png" alt="YouTube" style="width:50px; height:50px">
    </a>
    <a href="https://ph.pinterest.com/">
      <img src="images.jpg" alt="images" style="width:50px; height:50px">
    </a>
  </aside>

  <footer><p>All Rights Reserved 2026</p></footer>

</div>

</body>
</html>
